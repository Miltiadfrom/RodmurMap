services:
  atlas:
    build: .
    image: rodmur-atlas
    container_name: rodmur-atlas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Оставьте пустым — сервер создаст пароль сам и напечатает его в журнал:
      #   docker compose logs atlas
      RODMUR_ADMIN_PASSWORD: "${RODMUR_ADMIN_PASSWORD:-}"
    volumes:
      - rodmur-data:/data

volumes:
  rodmur-data:
